name: Release

# Pushing a tag like v2.5.0 builds every platform and publishes the combined
# .geode package as a GitHub Release, so players can download stable builds
# without digging through Actions artifacts.
on:
  push:
    tags:
      - "v*"

jobs:
  tests:
    name: Core tests (host)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run core tests
        run: bash tests/run_tests.sh
      - name: Run core tests under ASan/UBSan
        run: SANITIZE=1 bash tests/run_tests.sh

  build:
    strategy:
      fail-fast: false
      matrix:
        config:
        - name: Windows
          os: windows-latest
        - name: macOS
          os: macos-latest
        - name: iOS
          os: macos-latest
          target: iOS
        - name: Android32
          os: ubuntu-latest
          target: Android32
        - name: Android64
          os: ubuntu-latest
          target: Android64

    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Build the mod
        uses: geode-sdk/build-geode-mod@main
        with:
          bindings: geode-sdk/bindings
          combine: true
          target: ${{ matrix.config.target }}

  package:
    name: Publish release
    runs-on: ubuntu-latest
    needs: ['build', 'tests']

    steps:
      - uses: geode-sdk/build-geode-mod/combine@main
        id: build

      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ github.ref_name }}
          name: GDMenu ${{ github.ref_name }}
          generateReleaseNotes: true
          allowUpdates: true
          artifacts: "${{ steps.build.outputs.build-output }}/*.geode"
          body: |
            Install with Geode, or drop the `.geode` file into your mods folder.
            Changelog: see `changelog.md` in the repository.
